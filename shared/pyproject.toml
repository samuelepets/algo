[project]
name = "algo-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.63.1",
    "numpy>=2.4.6",
    "plotly>=5.24.0",
    "polars>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
