[project]
name = "tf13-ema-ribbon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.63.1",
    "numpy>=2.4.6",
    "polars>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
