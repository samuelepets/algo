[package]
name = "e0020_fast_backtester_composer"
version = "0.1.0"
edition = "2021"
description = "High-performance vectorized backtester for 1-minute OHLCV bars"
license = "GPL-2.0-only"

[lib]
name = "fast_backtester"
path = "src/lib.rs"

[[bin]]
name = "fast-backtester"
path = "src/bin/fast_backtester.rs"

[[bin]]
name = "benchmark-sma-crossover"
path = "src/bin/benchmark_sma_crossover.rs"

[[bench]]
name = "sma_crossover"
harness = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
flate2 = "1.1"
thiserror = "2.0"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.8", features = ["html_reports"] }
